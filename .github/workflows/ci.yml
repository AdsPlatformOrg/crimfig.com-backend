name: CI

on:
  workflow_dispatch:
    inputs:
      test_release_email:
        description: Send one release alert delivery test
        type: boolean
        default: false
  push:
    branches: [dev, production, main]
  pull_request:
    branches: [dev, production, main]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (enforces pnpm — blocks npm/yarn)
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Validate migration registry
        run: node scripts/validate-migration-registry.cjs && node --test scripts/validate-migration-registry.test.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build (affected packages)
        run: pnpm run build

  release-build:
    name: Clean backend release image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag crimfig-release-ci .

  delivery-smoke:
    name: Staging release acceptance
    needs: release-build
    timeout-minutes: 20
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      statuses: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mark staging verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, state: 'pending',
              context: 'staging-release-verified',
              description: 'Waiting for exact-revision staging acceptance',
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - run: node scripts/release-delivery-smoke.cjs | tee staging-release-acceptance.json
        env:
          RELEASE_ADS_BASE_URL: ${{ vars.RELEASE_ADS_BASE_URL }}
          RELEASE_PUBLISHER_ORIGIN: ${{ vars.RELEASE_PUBLISHER_ORIGIN }}
          RELEASE_ADS_SLOT: ${{ vars.RELEASE_ADS_SLOT }}
          RELEASE_AUTH_BASE_URL: ${{ vars.RELEASE_AUTH_BASE_URL }}
          RELEASE_BILLING_BASE_URL: ${{ vars.RELEASE_BILLING_BASE_URL }}
          RELEASE_REPORT_EMAIL: ${{ vars.RELEASE_REPORT_EMAIL }}
          RELEASE_REPORT_PASSWORD: ${{ secrets.RELEASE_REPORT_PASSWORD }}
          RELEASE_EXPECTED_REVISION: ${{ github.sha }}
          RELEASE_WAIT_SECONDS: '900'
      - uses: actions/upload-artifact@v4
        with:
          name: staging-release-acceptance
          path: staging-release-acceptance.json
      - name: Record staging verification outcome
        if: always()
        uses: actions/github-script@v7
        env:
          ACCEPTANCE_RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha,
              state: process.env.ACCEPTANCE_RESULT === 'success' ? 'success' : 'failure',
              context: 'staging-release-verified',
              description: 'Exact-revision readiness, delivery and authenticated reporting',
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Verify configured email delivery
        if: success() && inputs.test_release_email
        run: node scripts/send-release-alert.cjs --test
        env:
          RELEASE_AUTH_BASE_URL: ${{ vars.RELEASE_AUTH_BASE_URL }}

  notify-release-failure:
    name: Release failure email
    needs: [ci, release-build, delivery-smoke]
    if: always() && github.ref == 'refs/heads/dev' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/send-release-alert.cjs
        env:
          RELEASE_AUTH_BASE_URL: ${{ vars.RELEASE_AUTH_BASE_URL }}
